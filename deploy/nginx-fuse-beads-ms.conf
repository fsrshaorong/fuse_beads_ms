map $http_upgrade $beads_ms_connection {
    default upgrade;
    '' close;
}
limit_req_zone $binary_remote_addr zone=beads_ms_handshake:10m rate=10r/s;
limit_conn_zone $binary_remote_addr zone=beads_ms_connections:10m;

server {
    listen 80;
    listen 5173;
    server_name 101.132.62.222;
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/fuse-beads-ms-acme;
        try_files $uri =404;
    }
    location / {
        return 301 https://101.132.62.222$request_uri;
    }
}

server {
    listen 443 ssl;
    server_name 101.132.62.222;
    ssl_certificate /etc/letsencrypt/live/fuse-beads-ms-ip/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/fuse-beads-ms-ip/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    root /var/www/fuse-beads-ms/current;
    index index.html;
    client_max_body_size 64k;

    location /socket.io/ {
        limit_req zone=beads_ms_handshake burst=30 nodelay;
        limit_conn beads_ms_connections 64;
        proxy_pass http://127.0.0.1:2567;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $beads_ms_connection;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 75s;
        proxy_send_timeout 75s;
        proxy_buffering off;
    }
    location = /health {
        proxy_pass http://127.0.0.1:2567/health;
    }
    location /assets/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
        add_header X-Content-Type-Options nosniff;
    }
}
